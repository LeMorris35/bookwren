workflows:
  ios-testflight:
    name: BookWren iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Must match the exact Name of the App Store Connect API key in
      # Codemagic Settings -> Integrations -> App Store Connect.
      # Reuse the existing key or add a new one — the same key works for
      # every app on your Apple account.
      app_store_connect: LifeMetricOS ASC
    environment:
      node: 22
      xcode: latest
      groups:
        # Codemagic UI -> Environment variables. Must hold
        # CERTIFICATE_PRIVATE_KEY (marked Secure): the one reusable signing
        # key, so we never mint a new Apple certificate per build.
        - signing
      vars:
        BUNDLE_ID: "com.lammedia.bookwren"
        # Apple's numeric app id (App Store Connect -> App Information ->
        # General Information -> Apple ID). Drives build-number increments.
        APP_STORE_APP_ID: "6797727632"
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Generate app icon + splash screens
        # Regenerates every size from assets/icon.png and assets/splash*.png,
        # so the shipped icon can never drift from the brand art.
        script: npx @capacitor/assets generate --ios
      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios
          # Package.swift is committed from a Windows machine, where the
          # Capacitor CLI writes backslash paths that SwiftPM on macOS can't
          # resolve. Normalise them before building.
          sed -i '' 's#\\\\#/#g' ios/App/CapApp-SPM/Package.swift || true
          echo "--- Package.swift the build will use ---"
          cat ios/App/CapApp-SPM/Package.swift
      - name: Create signing certificate + profile
        script: |
          set -ex
          keychain initialize
          # Apple caps how many Distribution certificates an account may hold.
          # Generating a throwaway key each build means we never match the
          # existing certificate, so Apple eventually refuses with a 409.
          # Instead reuse ONE key, stored in Codemagic as the secure env var
          # CERTIFICATE_PRIVATE_KEY — the same certificate gets reused forever.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            # Accept the saved key in whatever shape it survived the web form:
            # base64-encoded, clean PEM, or a PEM whose newlines got flattened
            # (the usual damage when pasting into a browser field).
            python3 - > /tmp/dist_cert_key.pem <<'PYEOF'
          import base64, binascii, os, re, sys, textwrap

          raw = os.environ["CERTIFICATE_PRIVATE_KEY"].strip().strip('"').strip("'")

          def emit(label, body):
              print(f"-----BEGIN {label}-----")
              print("\n".join(textwrap.wrap(body, 64)))
              print(f"-----END {label}-----")

          # 1) A PEM that still has its BEGIN/END markers, however mangled the
          #    line breaks in between got.
          m = re.search(r"-----BEGIN ([A-Z0-9 ]*PRIVATE KEY)-----(.*?)-----END \1-----", raw, re.S)
          if m:
              emit(m.group(1), re.sub(r"\s+", "", m.group(2)))
              sys.exit(0)

          # 2) base64 of a whole PEM file. Web forms love to inject line breaks,
          #    so strip every scrap of whitespace before decoding.
          compact = re.sub(r"\s+", "", raw)
          try:
              decoded = base64.b64decode(compact + "=" * (-len(compact) % 4)).decode("utf-8", "ignore")
          except (binascii.Error, ValueError):
              decoded = ""
          m = re.search(r"-----BEGIN ([A-Z0-9 ]*PRIVATE KEY)-----(.*?)-----END \1-----", decoded, re.S)
          if m:
              emit(m.group(1), re.sub(r"\s+", "", m.group(2)))
              sys.exit(0)

          # 3) Just the base64 body, with the BEGIN/END lines lost in the copy.
          #    Decode to DER and put the right wrapper back on.
          try:
              der = base64.b64decode(compact + "=" * (-len(compact) % 4))
          except (binascii.Error, ValueError):
              der = b""
          if der[:1] == b"\x30":  # an ASN.1 SEQUENCE, so a DER-encoded key
              # PKCS#8 carries the rsaEncryption OID; PKCS#1 doesn't.
              is_pkcs8 = b"\x2a\x86\x48\x86\xf7\x0d\x01\x01\x01" in der[:64]
              emit("PRIVATE KEY" if is_pkcs8 else "RSA PRIVATE KEY", compact)
              sys.exit(0)

          sys.exit(
              "CERTIFICATE_PRIVATE_KEY is not a PEM private key or base64 of one "
              f"(got {len(raw)} chars starting with {raw[:24]!r})"
          )
          PYEOF
            # Apple's tooling wants PKCS#1 ("BEGIN RSA PRIVATE KEY")
            if grep -q "BEGIN PRIVATE KEY" /tmp/dist_cert_key.pem; then
              openssl rsa -in /tmp/dist_cert_key.pem -traditional -out /tmp/dist_cert_key_p1.pem
              mv /tmp/dist_cert_key_p1.pem /tmp/dist_cert_key.pem
            fi
            echo "Signing key restored as: $(head -1 /tmp/dist_cert_key.pem)"
            # Fail loudly here rather than deep inside the Apple API call
            openssl rsa -in /tmp/dist_cert_key.pem -check -noout
          else
            echo "WARNING: no CERTIFICATE_PRIVATE_KEY set — creating a new certificate."
            echo "This burns one of your limited Apple certificate slots."
            openssl genrsa -out /tmp/dist_cert_key.pem 2048
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/dist_cert_key.pem \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
      - name: Build IPA (auto-incremented build number)
        script: |
          set -e
          if [ -n "$APP_STORE_APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          else
            LATEST=0
          fi
          BUILD_NUMBER=$(( LATEST + 1 ))
          echo "Latest uploaded build was $LATEST; using build number $BUILD_NUMBER"
          # Xcode's exit 65 tells you nothing on its own, so surface the real
          # error lines if the archive fails.
          if ! xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-flags="CURRENT_PROJECT_VERSION=$BUILD_NUMBER"; then
            echo "===== ARCHIVE FAILED — actual errors ====="
            grep -iE "error:|fatal|entitlement|provisioning|No such module|does not contain" \
              /tmp/xcodebuild_*.log 2>/dev/null | tail -40 || true
            echo "===== last 60 log lines ====="
            tail -60 /tmp/xcodebuild_*.log 2>/dev/null || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_*.log
    publishing:
      email:
        recipients:
          - levim713@outlook.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Uploads the build — internal testers (you and Lydia) get it right
        # away. External beta review is a separate, manual step in App Store
        # Connect once the Test Information is filled in.
        submit_to_testflight: false
